app-id: net.krafting.SemantiK
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: SemantiK.py
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11

add-extensions:
  net.krafting.SemantiK.Lang:
    directory: share/extra
    subdirectories: true
    no-autodownload: true
    autodelete: true
  net.krafting.SemantiK.Lang.French:
    no-autodownload: false
    autodelete: true


cleanup-commands:
  - mkdir -p /app/share/extra

modules:
  - name: OpenBLAS
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DDYNAMIC_ARCH=ON
      # - -DTARGET=ARMV8
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.29/OpenBLAS-0.3.29.tar.gz
        sha512: 046316b4297460bffca09c890ecad17ea39d8b3db92ff445d03b547dd551663d37e40f38bce8ae11e2994374ff01e622b408da27aa8e40f4140185ee8f001a60

  # - name: LAPACK
  #   buildsystem: cmake-ninja
  #   builddir: true
  #   config-opts:
  #     - -DCMAKE_BUILD_TYPE=Release
  #     - -DBUILD_SHARED_LIBS=ON
  #     - -DBUILD_TESTING=OFF
  #     - -DCMAKE_Fortran_COMPILER=gfortran
  #     - -DLAPACKE=ON
  #     - -DCBLAS=ON
  #   sources:
  #     - type: git
  #       url: https://github.com/Reference-LAPACK/lapack.git
  #       tag: v3.12.1
  #       commit: 6ec7f2bc4ecf4c4a93496aa2fa519575bc0e39ca

  - name: meson-python
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/mesonbuild/meson-python
        tag: '0.18.0'
        commit: e094949f466ae69043fcec3ec68b41ace900ed97

  - python3-pyproject_metadata.json

  - python3-numpy.json

  - python3-pythran.json

  - python3-pybind11.json

  - python3-scipy.json

  - python3-smart_open.json

  - name: Gensim
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/piskvorky/gensim
        tag: '4.4.0'
        commit: ee2642b4fa26e689ba4595067504668bc7a89016

  - name: SemantiK
    buildsystem: simple
    build-commands:
      - install -Dm755 SemantiK.py /app/bin/SemantiK.py
      - cp -r locales /app/
      - cp -r utils /app/bin/
      - install -Dm 0644 net.krafting.SemantiK.desktop  /app/share/applications/net.krafting.SemantiK.desktop
      - install -Dm 0644 net.krafting.SemantiK.metainfo.xml  /app/share/metainfo/net.krafting.SemantiK.metainfo.xml
      - install -Dm 0644 images/net.krafting.SemantiK.svg /app/share/icons/hicolor/scalable/apps/net.krafting.SemantiK.svg
      - install -Dm 0644 images/icons-symbolic/* /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: git
        url: https://gitlab.com/Krafting/semantik-gtk
        tag: 1.7.3
        commit: c918d4a9712633baca5f7dfbc01c932325fe43df
        x-checker-data: {type: git, tag-pattern: '^([\d.]+)$'}
